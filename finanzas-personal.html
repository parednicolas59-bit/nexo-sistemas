<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Gastos — Nico</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a26;--bg4:#22223a;
  --ink:#f0eeff;--ink2:#a09ab8;--ink3:#5a556e;
  --purple:#7c5cfc;--purple2:#a07aff;--purple3:#c4aaff;
  --green:#00e5a0;--greenl:rgba(0,229,160,0.12);
  --red:#ff4d6d;--redl:rgba(255,77,109,0.12);
  --gold:#ffd166;--goldl:rgba(255,209,102,0.12);
  --blue:#38bdf8;--bluel:rgba(56,189,248,0.12);
  --border:rgba(255,255,255,0.07);
  --shadow:0 4px 24px rgba(0,0,0,0.4);
  --font:'Syne',sans-serif;
  --mono:'DM Mono',monospace;
  --r:12px;
}
body{background:var(--bg);font-family:var(--font);color:var(--ink);min-height:100vh}

/* BG */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 20% 0%,rgba(124,92,252,0.12) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 100%,rgba(0,229,160,0.06) 0%,transparent 60%);pointer-events:none;z-index:0}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:100;background:rgba(10,10,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-size:16px;font-weight:800;letter-spacing:-0.5px;color:var(--ink)}
.logo span{color:var(--purple2)}
.topbar-actions{display:flex;gap:8px}

/* CONTENT */
.wrap{max-width:1000px;margin:0 auto;padding:24px 20px;position:relative;z-index:1}

/* MÉTRICAS */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.metric{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:18px;position:relative;overflow:hidden}
.metric::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.metric.m-total::before{background:linear-gradient(90deg,var(--purple),var(--purple2))}
.metric.m-ars::before{background:linear-gradient(90deg,var(--gold),#ffaa00)}
.metric.m-usd::before{background:linear-gradient(90deg,var(--green),#00c4a0)}
.metric.m-mes::before{background:linear-gradient(90deg,var(--blue),#60a5fa)}
.metric-label{font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink3);margin-bottom:8px}
.metric-val{font-family:var(--mono);font-size:22px;font-weight:500;color:var(--ink)}
.metric-sub{font-size:11px;color:var(--ink3);margin-top:4px}

/* CARD */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.card-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--ink2);text-transform:uppercase}

/* BOTONES */
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--ink);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap;letter-spacing:.3px}
.btn:hover{border-color:var(--purple);color:var(--purple2)}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:var(--purple2);border-color:var(--purple2)}
.btn.danger{border-color:rgba(255,77,109,0.3);color:var(--red)}
.btn.danger:hover{background:var(--redl)}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px 18px}
.form-row{display:flex;flex-direction:column;gap:5px}
.form-row.full{grid-column:1/-1}
.form-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3)}
.inp{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--ink);font-family:var(--font);font-size:13px;outline:none;transition:border-color .2s;width:100%}
.inp:focus{border-color:var(--purple)}
.inp option{background:var(--bg3)}

/* TABLA */
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--border);background:var(--bg3)}
td{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.04);color:var(--ink);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(124,92,252,0.04)}
.empty{text-align:center;padding:40px;color:var(--ink3);font-size:13px}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.3px}
.badge-ars{background:var(--goldl);color:var(--gold)}
.badge-usd{background:var(--greenl);color:var(--green)}

/* FUENTE TAGS */
.fuente-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:.3px}
.f-lemon{background:rgba(255,209,0,0.12);color:#ffd100}
.f-nbch{background:rgba(56,189,248,0.12);color:#38bdf8}
.f-galicia{background:rgba(255,77,77,0.12);color:#ff4d4d}
.f-nickcel{background:rgba(124,92,252,0.12);color:#a07aff}
.f-sueldo{background:rgba(0,229,160,0.12);color:#00e5a0}
.f-capital{background:rgba(255,165,0,0.12);color:#ffa500}
.f-dolarapp{background:rgba(0,200,255,0.12);color:#00c8ff}
.f-otro{background:rgba(160,154,184,0.12);color:#a09ab8}
.f-ahorros{background:rgba(255,157,226,0.12);color:#ff9de2}
.f-supervielle{background:rgba(0,207,170,0.12);color:#00cfaa}

/* GRÁFICO */
.bar-wrap{padding:16px 18px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-label{font-size:11px;font-weight:600;color:var(--ink2);width:90px;flex-shrink:0;text-align:right}
.bar-track{flex:1;background:var(--bg3);border-radius:20px;height:8px;overflow:hidden}
.bar-fill{height:100%;border-radius:20px;transition:width .6s ease}
.bar-val{font-family:var(--mono);font-size:11px;color:var(--ink3);width:100px;flex-shrink:0}

/* FILTROS */
.filtros{display:flex;gap:8px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--border)}
.filtro-btn{padding:4px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--ink3);font-family:var(--font);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s}
.filtro-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:24px;width:100%;max-width:460px;box-shadow:0 20px 60px rgba(0,0,0,0.6)}
.modal-title{font-size:18px;font-weight:800;margin-bottom:18px;color:var(--ink)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* WATERMARK */
.watermark{position:fixed;bottom:12px;right:16px;z-index:9999;pointer-events:none;user-select:none;opacity:0.35;display:flex;align-items:center;gap:5px;background:rgba(124,92,252,0.1);padding:5px 10px;border-radius:20px;border:1px solid rgba(124,92,252,0.2)}
.watermark span{font-size:10px;font-weight:700;color:var(--purple3);letter-spacing:1px;text-transform:uppercase}

@media(max-width:600px){
  .metrics{grid-template-columns:1fr 1fr}
  .form-grid{grid-template-columns:1fr}
  .form-row.full{grid-column:1}
  .wrap{padding:16px 12px}
  table{font-size:11px}
  th,td{padding:8px 10px}
}
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">Mis <span>Gastos</span></div>
  <div class="topbar-actions">
    <button class="btn" id="nuevo-supervielle-btn" style="border-color:rgba(0,207,170,0.4);color:#00cfaa">🏦 Supervielle</button>
    <button class="btn" id="nuevo-ahorro-btn" style="border-color:rgba(255,157,226,0.4);color:#ff9de2">💰 Ahorros</button>
    <button class="btn primary" id="nuevo-gasto-btn">+ Nuevo gasto</button>
  </div>
</div>

<div class="wrap">
  <!-- MÉTRICAS -->
  <div class="metrics" id="metrics"></div>

  <!-- GRÁFICO POR FUENTE -->
  <div class="card" id="grafico-card">
    <div class="card-header"><span class="card-title">Gasto por fuente</span><span id="grafico-moneda-toggle" style="font-size:11px;color:var(--ink3);cursor:pointer">Ver en USD</span></div>
    <div class="bar-wrap" id="grafico"></div>
  </div>

  <!-- SUPERVIELLE -->
  <div class="card" id="supervielle-card"></div>

  <!-- AHORROS -->
  <div class="card" id="ahorros-card"></div>

  <!-- TABLA -->
  <div class="card">
    <div class="card-header"><span class="card-title">Movimientos</span></div>
    <div class="filtros" id="filtros"></div>
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Fuente</th><th>Categoría</th><th>Moneda</th><th>Monto</th><th></th></tr></thead>
      <tbody id="tabla-body"></tbody>
    </table>
  </div>
</div>

<!-- MODAL -->
<div id="modal-container"></div>

<div class="watermark"><span>👑</span><span>Nexo Sistemas</span></div>

<script>
'use strict';
const SK = 'nicogastos_v1';
const FUENTES = ['Lemon Card','NBCH','Galicia','Supervielle','Nickcel','Sueldo','Capital Inversión','DolarApp','Ahorros','Otro'];
const CATEGORIAS = ['Vivienda','Comida','Transporte','Salud','Trabajo','Tecnología','Ropa','Entretenimiento','Servicios','Inversión','Otro'];
const FUENTE_CLASS = {'Lemon Card':'f-lemon','NBCH':'f-nbch','Galicia':'f-galicia','Supervielle':'f-supervielle','Nickcel':'f-nickcel','Sueldo':'f-sueldo','Capital Inversión':'f-capital','DolarApp':'f-dolarapp','Ahorros':'f-ahorros','Otro':'f-otro'};
const FUENTE_COLOR = {'Lemon Card':'#ffd100','NBCH':'#38bdf8','Galicia':'#ff4d4d','Supervielle':'#00cfaa','Nickcel':'#a07aff','Sueldo':'#00e5a0','Capital Inversión':'#ffa500','DolarApp':'#00c8ff','Ahorros':'#ff9de2','Otro':'#a09ab8'};

const fmtARS = n => '$' + Math.round(n||0).toLocaleString('es-AR');
const fmtUSD = n => 'U$S ' + (n||0).toLocaleString('es-AR', {minimumFractionDigits:2, maximumFractionDigits:2});
const hoy = () => new Date().toISOString().split('T')[0];
const fd = s => { if(!s) return '—'; const [y,m,d] = s.split('-'); return `${d}/${m}/${y}`; };

const DEF = { gastos: [], ahorros: [], supervielle: [], nextIdAhorro: 1, nextIdSupervielle: 1, nextId: 1 };

function loadData() {
  try {
    const s = localStorage.getItem(SK);
    if(!s) return JSON.parse(JSON.stringify(DEF));
    const d = JSON.parse(s);
    if(!d.gastos) d.gastos = [];
    if(!d.ahorros) d.ahorros = [];
    if(!d.supervielle) d.supervielle = [];
    if(!d.nextId) d.nextId = (d.gastos.reduce((m,g) => Math.max(m,g.id),0) + 1);
    if(!d.nextIdAhorro) d.nextIdAhorro = (d.ahorros.reduce((m,a) => Math.max(m,a.id),0) + 1);
    if(!d.nextIdSupervielle) d.nextIdSupervielle = (d.supervielle.reduce((m,s) => Math.max(m,s.id),0) + 1);
    return d;
  } catch(e) { return JSON.parse(JSON.stringify(DEF)); }
}
function save(d) { try { localStorage.setItem(SK, JSON.stringify(d)); } catch(e) { alert('Error al guardar.'); } }

let data = loadData();
let filtroFuente = 'Todos';
let filtroMoneda = 'Todos';
let graficoMoneda = 'ARS';
let modal = null;

function render() {
  renderMetrics();
  renderSupervielleCard();
  renderAhorrosCard();
  renderGrafico();
  renderFiltros();
  renderTabla();
  renderModal();
  bindEvents();
}

function getGastosFiltrados() {
  return data.gastos.filter(g => {
    if(filtroFuente !== 'Todos' && g.fuente !== filtroFuente) return false;
    if(filtroMoneda !== 'Todos' && g.moneda !== filtroMoneda) return false;
    return true;
  });
}

function getSaldoSupervielle(moneda) {
  return data.supervielle.filter(s=>s.moneda===moneda).reduce((sum,s)=>sum+(s.tipo==='ingreso'?s.monto:-s.monto),0);
}

function renderSupervielleCard() {
  const saldoARS = getSaldoSupervielle('ARS');
  const saldoUSD = getSaldoSupervielle('USD');
  const card = document.getElementById('supervielle-card');
  if(!card) return;
  const movs = data.supervielle.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);
  card.innerHTML = `
    <div class="card-header">
      <span class="card-title">🏦 Supervielle</span>
      <span style="font-size:11px;color:var(--ink3)">${data.supervielle.length} movimientos</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)">
      <div style="background:var(--bg3);border-radius:10px;padding:14px;text-align:center">
        <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">Saldo ARS</div>
        <div style="font-family:var(--mono);font-size:20px;color:${saldoARS>=0?'#00cfaa':'var(--red)'};">${fmtARS(saldoARS)}</div>
      </div>
      <div style="background:var(--bg3);border-radius:10px;padding:14px;text-align:center">
        <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">Saldo USD</div>
        <div style="font-family:var(--mono);font-size:20px;color:${saldoUSD>=0?'#00cfaa':'var(--red)'};">${fmtUSD(saldoUSD)}</div>
      </div>
    </div>
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Moneda</th><th>Monto</th><th></th></tr></thead>
      <tbody>
        ${movs.length===0?`<tr><td colspan="6" class="empty">Sin movimientos en Supervielle</td></tr>`:''}
        ${movs.map(s=>`<tr>
          <td style="color:var(--ink3);font-family:var(--mono);font-size:11px">${fd(s.fecha)}</td>
          <td><strong>${s.descripcion}</strong></td>
          <td><span class="badge" style="background:${s.tipo==='ingreso'?'var(--greenl)':'var(--redl)'};color:${s.tipo==='ingreso'?'var(--green)':'var(--red)'}">${s.tipo==='ingreso'?'↑ Ingreso':'↓ Egreso'}</span></td>
          <td><span class="badge ${s.moneda==='ARS'?'badge-ars':'badge-usd'}">${s.moneda}</span></td>
          <td style="font-family:var(--mono);font-weight:500;color:${s.tipo==='ingreso'?'#00cfaa':'var(--red)'};">${s.tipo==='ingreso'?'+':'-'}${s.moneda==='ARS'?fmtARS(s.monto):fmtUSD(s.monto)}</td>
          <td><button class="btn danger" data-del-supervielle="${s.id}" style="font-size:10px;padding:2px 8px">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function getSaldoAhorros(moneda) {
  return data.ahorros.filter(a=>a.moneda===moneda).reduce((s,a)=>s+(a.tipo==='deposito'?a.monto:-a.monto),0);
}

function renderAhorrosCard() {
  const saldoARS = getSaldoAhorros('ARS');
  const saldoUSD = getSaldoAhorros('USD');
  const card = document.getElementById('ahorros-card');
  if(!card) return;
  const movs = data.ahorros.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha)).slice(0,8);
  card.innerHTML = `
    <div class="card-header">
      <span class="card-title">💰 Ahorros</span>
      <span style="font-size:11px;color:var(--ink3)">${data.ahorros.length} movimientos</span>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px 18px;border-bottom:1px solid var(--border)">
      <div style="background:var(--bg3);border-radius:10px;padding:14px;text-align:center">
        <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">Saldo ARS</div>
        <div style="font-family:var(--mono);font-size:20px;color:${saldoARS>=0?'var(--gold)':'var(--red)'};">${fmtARS(saldoARS)}</div>
      </div>
      <div style="background:var(--bg3);border-radius:10px;padding:14px;text-align:center">
        <div style="font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">Saldo USD</div>
        <div style="font-family:var(--mono);font-size:20px;color:${saldoUSD>=0?'var(--green)':'var(--red)'};">${fmtUSD(saldoUSD)}</div>
      </div>
    </div>
    <table>
      <thead><tr><th>Fecha</th><th>Descripción</th><th>Tipo</th><th>Moneda</th><th>Monto</th><th></th></tr></thead>
      <tbody>
        ${movs.length===0?`<tr><td colspan="6" class="empty">Sin movimientos de ahorro</td></tr>`:''}
        ${movs.map(a=>`<tr>
          <td style="color:var(--ink3);font-family:var(--mono);font-size:11px">${fd(a.fecha)}</td>
          <td><strong>${a.descripcion}</strong></td>
          <td><span class="badge" style="background:${a.tipo==='deposito'?'var(--greenl)':'var(--redl)'};color:${a.tipo==='deposito'?'var(--green)':'var(--red)'}">${a.tipo==='deposito'?'↑ Depósito':'↓ Retiro'}</span></td>
          <td><span class="badge ${a.moneda==='ARS'?'badge-ars':'badge-usd'}">${a.moneda}</span></td>
          <td style="font-family:var(--mono);font-weight:500;color:${a.tipo==='deposito'?'var(--green)':'var(--red)'};">${a.tipo==='deposito'?'+':'-'}${a.moneda==='ARS'?fmtARS(a.monto):fmtUSD(a.monto)}</td>
          <td><button class="btn danger" data-del-ahorro="${a.id}" style="font-size:10px;padding:2px 8px">✕</button></td>
        </tr>`).join('')}
      </tbody>
    </table>
  `;
}

function renderMetrics() {
  const gastos = data.gastos;
  const totalARS = gastos.filter(g=>g.moneda==='ARS').reduce((s,g)=>s+g.monto,0);
  const totalUSD = gastos.filter(g=>g.moneda==='USD').reduce((s,g)=>s+g.monto,0);
  const mes = new Date().toISOString().substring(0,7);
  const totalMesARS = gastos.filter(g=>g.moneda==='ARS'&&g.fecha.startsWith(mes)).reduce((s,g)=>s+g.monto,0);
  const totalMesUSD = gastos.filter(g=>g.moneda==='USD'&&g.fecha.startsWith(mes)).reduce((s,g)=>s+g.monto,0);

  document.getElementById('metrics').innerHTML = `
    <div class="metric m-total">
      <div class="metric-label">Total ARS</div>
      <div class="metric-val">${fmtARS(totalARS)}</div>
      <div class="metric-sub">${gastos.filter(g=>g.moneda==='ARS').length} movimientos</div>
    </div>
    <div class="metric m-usd">
      <div class="metric-label">Total USD</div>
      <div class="metric-val">${fmtUSD(totalUSD)}</div>
      <div class="metric-sub">${gastos.filter(g=>g.moneda==='USD').length} movimientos</div>
    </div>
    <div class="metric m-ars">
      <div class="metric-label">Este mes ARS</div>
      <div class="metric-val">${fmtARS(totalMesARS)}</div>
      <div class="metric-sub">${new Date().toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</div>
    </div>
    <div class="metric m-mes">
      <div class="metric-label">Este mes USD</div>
      <div class="metric-val">${fmtUSD(totalMesUSD)}</div>
      <div class="metric-sub">${new Date().toLocaleDateString('es-AR',{month:'long',year:'numeric'})}</div>
    </div>
    <div class="metric" style="border-top:2px solid #00cfaa">
      <div class="metric-label">Supervielle ARS</div>
      <div class="metric-val" style="color:#00cfaa">${fmtARS(getSaldoSupervielle('ARS'))}</div>
      <div class="metric-sub">saldo disponible</div>
    </div>
    <div class="metric" style="border-top:2px solid #ff9de2">
      <div class="metric-label">Ahorros ARS</div>
      <div class="metric-val" style="color:#ff9de2">${fmtARS(getSaldoAhorros('ARS'))}</div>
      <div class="metric-sub">saldo disponible</div>
    </div>
    <div class="metric" style="border-top:2px solid #ff9de2">
      <div class="metric-label">Ahorros USD</div>
      <div class="metric-val" style="color:#ff9de2">${fmtUSD(getSaldoAhorros('USD'))}</div>
      <div class="metric-sub">saldo disponible</div>
    </div>
  `;
}

function renderGrafico() {
  const toggle = document.getElementById('grafico-moneda-toggle');
  if(toggle) toggle.textContent = graficoMoneda === 'ARS' ? 'Ver en USD' : 'Ver en ARS';

  const gastos = data.gastos.filter(g => g.moneda === graficoMoneda);
  const porFuente = {};
  FUENTES.forEach(f => porFuente[f] = 0);
  gastos.forEach(g => { if(porFuente[g.fuente] !== undefined) porFuente[g.fuente] += g.monto; });
  const max = Math.max(...Object.values(porFuente), 1);
  const fmt = graficoMoneda === 'ARS' ? fmtARS : fmtUSD;

  document.getElementById('grafico').innerHTML = FUENTES.map(f => {
    const val = porFuente[f];
    const pct = Math.round((val/max)*100);
    if(val === 0) return '';
    return `<div class="bar-row">
      <div class="bar-label"><span class="fuente-tag ${FUENTE_CLASS[f]}">${f}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${FUENTE_COLOR[f]}"></div></div>
      <div class="bar-val">${fmt(val)}</div>
    </div>`;
  }).join('') || `<div class="empty">Sin gastos en ${graficoMoneda}</div>`;
}

function renderFiltros() {
  const fuentes = ['Todos', ...FUENTES.filter(f => data.gastos.some(g=>g.fuente===f))];
  document.getElementById('filtros').innerHTML = `
    <button class="filtro-btn ${filtroMoneda==='Todos'?'active':''}" data-filtro-moneda="Todos">Todos</button>
    <button class="filtro-btn ${filtroMoneda==='ARS'?'active':''}" data-filtro-moneda="ARS">ARS</button>
    <button class="filtro-btn ${filtroMoneda==='USD'?'active':''}" data-filtro-moneda="USD">USD</button>
    <span style="color:var(--border);margin:0 4px">|</span>
    ${fuentes.map(f=>`<button class="filtro-btn ${filtroFuente===f?'active':''}" data-filtro-fuente="${f}">${f}</button>`).join('')}
  `;
}

function renderTabla() {
  const gastos = getGastosFiltrados().slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
  document.getElementById('tabla-body').innerHTML = gastos.length === 0
    ? `<tr><td colspan="7" class="empty">Sin movimientos registrados</td></tr>`
    : gastos.map(g => `<tr>
        <td style="color:var(--ink3);font-family:var(--mono);font-size:11px">${fd(g.fecha)}</td>
        <td><strong>${g.descripcion}</strong>${g.notas?`<br><span style="font-size:11px;color:var(--ink3)">${g.notas}</span>`:''}</td>
        <td><span class="fuente-tag ${FUENTE_CLASS[g.fuente]}">${g.fuente}</span></td>
        <td style="color:var(--ink3);font-size:11px">${g.categoria}</td>
        <td><span class="badge ${g.moneda==='ARS'?'badge-ars':'badge-usd'}">${g.moneda}</span></td>
        <td style="font-family:var(--mono);font-weight:500;color:${g.moneda==='ARS'?'var(--gold)':'var(--green)'}">${g.moneda==='ARS'?fmtARS(g.monto):fmtUSD(g.monto)}</td>
        <td><button class="btn danger" data-del="${g.id}" style="font-size:10px;padding:2px 8px">✕</button></td>
      </tr>`).join('');
}

function renderModal() {
  if(!modal) { document.getElementById('modal-container').innerHTML = ''; return; }
  if(modal.type === 'nuevo-supervielle') {
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" id="modal-overlay">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">🏦 Movimiento Supervielle</div>
          <div class="form-grid">
            <div class="form-row">
              <label class="form-label">Fecha *</label>
              <input class="inp" type="date" id="sv-fecha" value="${hoy()}">
            </div>
            <div class="form-row">
              <label class="form-label">Tipo *</label>
              <select class="inp" id="sv-tipo">
                <option value="ingreso">↑ Ingreso</option>
                <option value="egreso">↓ Egreso</option>
              </select>
            </div>
            <div class="form-row full">
              <label class="form-label">Descripción *</label>
              <input class="inp" id="sv-desc" placeholder="ej. Sueldo, Pago alquiler, Transferencia...">
            </div>
            <div class="form-row">
              <label class="form-label">Moneda *</label>
              <select class="inp" id="sv-moneda">
                <option value="ARS">ARS — Pesos</option>
                <option value="USD">USD — Dólares</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label">Monto *</label>
              <input class="inp" type="number" id="sv-monto" placeholder="0" min="0" step="0.01">
            </div>
          </div>
          <div id="sv-error" style="color:var(--red);font-size:12px;margin:0 18px 8px;display:none"></div>
          <div class="form-actions" style="padding:0 18px 4px">
            <button class="btn" id="modal-cancel">Cancelar</button>
            <button class="btn primary" id="modal-save-supervielle" style="background:#00cfaa;border-color:#00cfaa;color:#001a16">Guardar</button>
          </div>
        </div>
      </div>`;
    bindEvents();
    return;
  }
  if(modal.type === 'nuevo-ahorro') {
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" id="modal-overlay">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">💰 Movimiento de ahorro</div>
          <div class="form-grid">
            <div class="form-row">
              <label class="form-label">Fecha *</label>
              <input class="inp" type="date" id="a-fecha" value="${hoy()}">
            </div>
            <div class="form-row">
              <label class="form-label">Tipo *</label>
              <select class="inp" id="a-tipo">
                <option value="deposito">↑ Depósito (ahorro)</option>
                <option value="retiro">↓ Retiro (uso)</option>
              </select>
            </div>
            <div class="form-row full">
              <label class="form-label">Descripción *</label>
              <input class="inp" id="a-desc" placeholder="ej. Guardé para emergencia, Usé para alquiler...">
            </div>
            <div class="form-row">
              <label class="form-label">Moneda *</label>
              <select class="inp" id="a-moneda">
                <option value="ARS">ARS — Pesos</option>
                <option value="USD">USD — Dólares</option>
              </select>
            </div>
            <div class="form-row">
              <label class="form-label">Monto *</label>
              <input class="inp" type="number" id="a-monto" placeholder="0" min="0" step="0.01">
            </div>
          </div>
          <div id="a-error" style="color:var(--red);font-size:12px;margin:0 18px 8px;display:none"></div>
          <div class="form-actions" style="padding:0 18px 4px">
            <button class="btn" id="modal-cancel">Cancelar</button>
            <button class="btn primary" id="modal-save-ahorro" style="background:#ff9de2;border-color:#ff9de2;color:#1a0a1a">Guardar</button>
          </div>
        </div>
      </div>`;
    bindEvents();
    return;
  }
  if(modal.type === 'nuevo-gasto') {
    document.getElementById('modal-container').innerHTML = `
      <div class="modal-bg" id="modal-overlay">
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-title">Nuevo gasto</div>
          <div class="form-grid">
            <div class="form-row">
              <label class="form-label">Fecha *</label>
              <input class="inp" type="date" id="g-fecha" value="${hoy()}">
            </div>
            <div class="form-row">
              <label class="form-label">Moneda *</label>
              <select class="inp" id="g-moneda">
                <option value="ARS">ARS — Pesos</option>
                <option value="USD">USD — Dólares</option>
              </select>
            </div>
            <div class="form-row full">
              <label class="form-label">Descripción *</label>
              <input class="inp" id="g-desc" placeholder="ej. Alquiler, Supermercado...">
            </div>
            <div class="form-row">
              <label class="form-label">Fuente *</label>
              <select class="inp" id="g-fuente">
                ${FUENTES.map(f=>`<option value="${f}">${f}</option>`).join('')}
              </select>
            </div>
            <div class="form-row">
              <label class="form-label">Categoría</label>
              <select class="inp" id="g-cat">
                ${CATEGORIAS.map(c=>`<option value="${c}">${c}</option>`).join('')}
              </select>
            </div>
            <div class="form-row full">
              <label class="form-label">Monto *</label>
              <input class="inp" type="number" id="g-monto" placeholder="0" min="0" step="0.01">
            </div>
            <div class="form-row full">
              <label class="form-label">Notas</label>
              <input class="inp" id="g-notas" placeholder="Opcional...">
            </div>
          </div>
          <div id="g-error" style="color:var(--red);font-size:12px;margin:0 18px 8px;display:none"></div>
          <div class="form-actions" style="padding:0 18px 4px">
            <button class="btn" id="modal-cancel">Cancelar</button>
            <button class="btn primary" id="modal-save-gasto">Guardar</button>
          </div>
        </div>
      </div>`;
  }
  bindEvents();
}

function bindEvents() {
  const q = id => document.getElementById(id);

  const overlay = q('modal-overlay');
  if(overlay) overlay.onclick = () => { modal = null; render(); };

  const ngb = q('nuevo-gasto-btn');
  if(ngb) ngb.onclick = () => { modal = { type: 'nuevo-gasto' }; render(); };

  const mc = q('modal-cancel');
  if(mc) mc.onclick = () => { modal = null; render(); };

  const msg = q('modal-save-gasto');
  if(msg) msg.onclick = () => {
    const fecha = q('g-fecha')?.value || hoy();
    const desc = (q('g-desc')?.value || '').trim();
    const fuente = q('g-fuente')?.value || 'Otro';
    const cat = q('g-cat')?.value || 'Otro';
    const moneda = q('g-moneda')?.value || 'ARS';
    const monto = parseFloat(q('g-monto')?.value) || 0;
    const notas = (q('g-notas')?.value || '').trim();
    const errDiv = q('g-error');
    if(!desc) { if(errDiv){ errDiv.textContent='⚠️ Ingresá una descripción.'; errDiv.style.display='block'; } return; }
    if(!monto || monto <= 0) { if(errDiv){ errDiv.textContent='⚠️ Ingresá un monto válido.'; errDiv.style.display='block'; } return; }
    data.gastos.unshift({ id: data.nextId++, fecha, descripcion: desc, fuente, categoria: cat, moneda, monto, notas });
    save(data);
    modal = null;
    render();
  };

  // Enter en monto
  const gm = q('g-monto');
  if(gm) gm.onkeydown = e => { if(e.key === 'Enter') q('modal-save-gasto')?.click(); };

  // Filtros
  document.querySelectorAll('[data-filtro-fuente]').forEach(b => {
    b.onclick = () => { filtroFuente = b.dataset.filtroFuente; render(); };
  });
  document.querySelectorAll('[data-filtro-moneda]').forEach(b => {
    b.onclick = () => { filtroMoneda = b.dataset.filtroMoneda; render(); };
  });

  // Toggle gráfico
  const gt = q('grafico-moneda-toggle');
  if(gt) gt.onclick = () => { graficoMoneda = graficoMoneda === 'ARS' ? 'USD' : 'ARS'; render(); };

  // Nuevo supervielle btn
  const nsv = document.getElementById('nuevo-supervielle-btn');
  if(nsv) nsv.onclick = () => { modal = { type: 'nuevo-supervielle' }; render(); };

  // Guardar supervielle
  const mssv = document.getElementById('modal-save-supervielle');
  if(mssv) mssv.onclick = () => {
    const fecha = document.getElementById('sv-fecha')?.value || hoy();
    const tipo = document.getElementById('sv-tipo')?.value || 'ingreso';
    const desc = (document.getElementById('sv-desc')?.value || '').trim();
    const moneda = document.getElementById('sv-moneda')?.value || 'ARS';
    const monto = parseFloat(document.getElementById('sv-monto')?.value) || 0;
    const errDiv = document.getElementById('sv-error');
    if(!desc) { if(errDiv){ errDiv.textContent='⚠️ Ingresá una descripción.'; errDiv.style.display='block'; } return; }
    if(!monto || monto <= 0) { if(errDiv){ errDiv.textContent='⚠️ Ingresá un monto válido.'; errDiv.style.display='block'; } return; }
    if(tipo === 'egreso') {
      const saldo = getSaldoSupervielle(moneda);
      if(monto > saldo) { if(errDiv){ errDiv.textContent=`⚠️ Saldo insuficiente en ${moneda}. Disponible: ${moneda==='ARS'?fmtARS(saldo):fmtUSD(saldo)}`; errDiv.style.display='block'; } return; }
    }
    data.supervielle.unshift({ id: data.nextIdSupervielle++, fecha, tipo, descripcion: desc, moneda, monto });
    save(data);
    modal = null;
    render();
  };

  // Eliminar supervielle
  document.querySelectorAll('[data-del-supervielle]').forEach(b => {
    b.onclick = () => {
      if(!confirm('¿Eliminar este movimiento?')) return;
      data.supervielle = data.supervielle.filter(s => s.id !== Number(b.dataset.delSupervielle));
      save(data);
      render();
    };
  });

  // Nuevo ahorro btn
  const nab = document.getElementById('nuevo-ahorro-btn');
  if(nab) nab.onclick = () => { modal = { type: 'nuevo-ahorro' }; render(); };

  // Guardar ahorro
  const msa = document.getElementById('modal-save-ahorro');
  if(msa) msa.onclick = () => {
    const fecha = document.getElementById('a-fecha')?.value || hoy();
    const tipo = document.getElementById('a-tipo')?.value || 'deposito';
    const desc = (document.getElementById('a-desc')?.value || '').trim();
    const moneda = document.getElementById('a-moneda')?.value || 'ARS';
    const monto = parseFloat(document.getElementById('a-monto')?.value) || 0;
    const errDiv = document.getElementById('a-error');
    if(!desc) { if(errDiv){ errDiv.textContent='⚠️ Ingresá una descripción.'; errDiv.style.display='block'; } return; }
    if(!monto || monto <= 0) { if(errDiv){ errDiv.textContent='⚠️ Ingresá un monto válido.'; errDiv.style.display='block'; } return; }
    if(tipo === 'retiro') {
      const saldo = getSaldoAhorros(moneda);
      if(monto > saldo) { if(errDiv){ errDiv.textContent=`⚠️ No tenés suficiente saldo en ${moneda}. Saldo actual: ${moneda==='ARS'?fmtARS(saldo):fmtUSD(saldo)}`; errDiv.style.display='block'; } return; }
    }
    data.ahorros.unshift({ id: data.nextIdAhorro++, fecha, tipo, descripcion: desc, moneda, monto });
    save(data);
    modal = null;
    render();
  };

  // Eliminar ahorro
  document.querySelectorAll('[data-del-ahorro]').forEach(b => {
    b.onclick = () => {
      if(!confirm('¿Eliminar este movimiento?')) return;
      data.ahorros = data.ahorros.filter(a => a.id !== Number(b.dataset.delAhorro));
      save(data);
      render();
    };
  });

  // Eliminar gasto
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => {
      if(!confirm('¿Eliminar este gasto?')) return;
      data.gastos = data.gastos.filter(g => g.id !== Number(b.dataset.del));
      save(data);
      render();
    };
  });
}

render();
</script>
</body>
</html>
